# ~/.config/foot/colors-tiled.ini
[main]
font=Jetbrains Mono:weight=Regular:size=11
pad=20x20 center

[cursor]
style=underline
blink=yes
underline-thickness=1.5

[mouse]
hide-when-typing=yes

[colors-dark]
cursor=7f7f7f 111111
alpha=1.0
foreground=000000
background=A0D7F2
regular0=000000
regular1=cc0000
regular2=00a600
regular3=999900
regular4=0000b2
regular5=b200b2
regular6=00a6b2
regular7=cccccc
bright0=666666
bright1=e50000
bright2=00d900
bright3=e5e500
bright4=0000ff
bright5=e500e5
bright6=00e5e5
bright7=e5e5e5
selection-foreground=A0D7F2
selection-background=000000

