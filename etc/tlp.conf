# ------------------------------------------------------------------------------
# TLP Configuration - MacBook Pro A1708 (i5-7360U, Arch Linux Hyprland)
# OTTIMIZZATO per CONTROLLO TERMICO e TEMPERATURE SICURE
# ------------------------------------------------------------------------------

# --------------------------
# Battery Charge Thresholds
# --------------------------
START_CHARGE_THRESH_BAT0=70
STOP_CHARGE_THRESH_BAT0=80

# --------------------------
# CPU Settings - OTTIMIZZATO PER TEMPERATURE
# --------------------------
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# LIMITI FREQUENZE per controllo termico
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=85       # 3.0GHz max invece di 3.6 GHz Turbo
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=60

# DISABILITAZIONE TURBO BOOST - fondamentale per temperature
CPU_BOOST_ON_AC=1           # SI turbo boost in AC
CPU_BOOST_ON_BAT=0          # NO turbo boost in battery
CPU_HWP_DYN_BOOST_ON_AC=1   # SI dynamic boosting
CPU_HWP_DYN_BOOST_ON_BAT=0  # NO dynamic boosting

# --------------------------
# GPU (Intel Iris Plus 640) - OTTIMIZZATO PER TEMPERATURE
# --------------------------
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MAX_FREQ_ON_AC=900    # ridotto per termica
INTEL_GPU_BOOST_FREQ_ON_AC=1000 # ridotto per termica
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_BAT=700
INTEL_GPU_BOOST_FREQ_ON_BAT=800
INTEL_GPU_MAX_FREQ_ON_BAT=700    # ridotto per termica

# --------------------------
# Disk/SSD Settings
# --------------------------
# DISK_DEVICES="nvme0n1"
# DISK_APM_LEVEL_ON_AC="254"
# DISK_APM_LEVEL_ON_BAT="128"
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=med_power_with_dipm

# --------------------------
# Wi-Fi (Broadcom BCM4350)
# --------------------------
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# --------------------------
# PCIe Active State Power Management
# --------------------------
PCIE_ASPM_ON_AC=powersave
PCIE_ASPM_ON_BAT=powersupersave

# --------------------------
# Runtime Power Management
# --------------------------
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_BLACKLIST="wlan0"

# --------------------------
# USB Autosuspend
# --------------------------
USB_AUTOSUSPEND=1
USB_BLACKLIST=""

# --------------------------
# Audio Power Saving
# --------------------------
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=0

# --------------------------
# Platform Profile
# --------------------------
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced

# --------------------------
# Fan Control (complementare a mbpfan)
# --------------------------
FAN_POLICY_ON_AC="enable"
FAN_POLICY_ON_BAT="enable"

# --------------------------
# NMI Watchdog
# --------------------------
NMI_WATCHDOG=0

# --------------------------
# Debugging
# --------------------------
TLP_DEBUG="bat disk"
