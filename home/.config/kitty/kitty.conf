# ============================================
# Kitty configuration - Nord + Blu Elettrico
# Allineato a ThinkPad X280
# ============================================

# --- Aspetto finestra ---
background_opacity 0.90
dynamic_background_opacity yes
background_tint 0.90
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0

# Wayland ottimizzato
linux_display_server wayland
wayland_titlebar_color background

# --- Font ---
font_family      IosevkaTerm Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0

# Rendering ottimizzato
text_composition_strategy platform
disable_ligatures never

# --- Colori Nord + Blu Elettrico (#00A8FF) ---
foreground             #ECEFF4
background             #2E3440
selection_foreground   #2E3440
selection_background   #00A8FF

# Colori normali
color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #3281EA
color5  #B48EAD
color6  #00BFFF
color7  #E5E9F0

# Colori brillanti
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #00A8FF
color13 #B48EAD
color14 #00D4FF
color15 #ECEFF4

# --- Cursore con trail ---
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor #00A8FF
cursor_text_color #2E3440

# --- Selezione ---
copy_on_select no
clipboard_control write-clipboard write-primary
select_by_word_characters :@-./_~?&=%+#

# --- Scorciatoie tastiera ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+n new_window
map ctrl+shift+f show_scrollback
map ctrl+shift+o kitten hints --type path --program @
map ctrl+shift+a set_background_opacity +0.05
map ctrl+shift+m set_background_opacity -0.05

# Scorciatoie tab
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+enter new_window_with_cwd

# --- Performance ---
scrollback_lines 10000
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- Audio ---
enable_audio_bell no

# --- Tab bar stile Nord ---
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #242933
active_tab_background #00A8FF
active_tab_foreground #2E3440
inactive_tab_background #3B4252
inactive_tab_foreground #D8DEE9
tab_bar_margin_width 0
tab_bar_margin_height 0 4
tab_title_template "{title[:20]}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"

# --- Mouse ---
mouse_hide_wait 3.0
focus_follows_mouse no
click_interval -1.0

# --- URL handling ---
url_color #00BFFF
url_style curly
open_url_with default
url_prefixes http https file ftp gemini irc gopher mailto news git
