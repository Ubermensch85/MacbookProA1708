# ------------------------------------------------------------------------------
# TLP 1.11.0 Configuration - MacBook Pro A1708 (i5-7360U, Arch Linux Hyprland)
# Ottimizzato per controllo termico, stabilità BCM4350 e profili PRF/BAL/SAV
# ------------------------------------------------------------------------------

# --------------------------
# Profili (AC -> PRF, Batteria -> BAL)
# --------------------------
TLP_AUTO_SWITCH=2
TLP_PROFILE_AC="PRF"
TLP_PROFILE_BAT="BAL"

# --------------------------
# CPU Settings (Intel i5-7360U - Controllo termico)
# --------------------------
CPU_SCALING_GOVERNOR_ON_PRF=powersave
CPU_SCALING_GOVERNOR_ON_BAL=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

CPU_ENERGY_PERF_POLICY_ON_PRF=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAL=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

CPU_MIN_PERF_ON_PRF=0
CPU_MAX_PERF_ON_PRF=85          # ~3.0 GHz max invece di 3.6 GHz Turbo
CPU_MIN_PERF_ON_BAL=0
CPU_MAX_PERF_ON_BAL=60
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=45

CPU_BOOST_ON_PRF=1              # Turbo boost attivo in PRF
CPU_BOOST_ON_BAL=0              # Turbo boost disabilitato in BAL
CPU_BOOST_ON_SAV=0              # Turbo boost disabilitato in SAV
CPU_HWP_DYN_BOOST_ON_PRF=1
CPU_HWP_DYN_BOOST_ON_BAL=0
CPU_HWP_DYN_BOOST_ON_SAV=0

# --------------------------
# GPU (Intel Iris Plus 640)
# --------------------------
INTEL_GPU_MIN_FREQ_ON_PRF=300
INTEL_GPU_MAX_FREQ_ON_PRF=900
INTEL_GPU_BOOST_FREQ_ON_PRF=1000
INTEL_GPU_MIN_FREQ_ON_BAL=300
INTEL_GPU_MAX_FREQ_ON_BAL=700
INTEL_GPU_BOOST_FREQ_ON_BAL=700
INTEL_GPU_MIN_FREQ_ON_SAV=300
INTEL_GPU_MAX_FREQ_ON_SAV=500
INTEL_GPU_BOOST_FREQ_ON_SAV=500

INTEL_GPU_POWER_PROFILE_ON_PRF=base
INTEL_GPU_POWER_PROFILE_ON_BAL=power_saving
INTEL_GPU_POWER_PROFILE_ON_SAV=power_saving

# --------------------------
# Disk / NVMe (APPLE SSD SM0128L)
# --------------------------
DISK_DEVICES="nvme0n1"
DISK_IOSCHED="keep"

# --------------------------
# Wi-Fi (Broadcom BCM4350 - power saving disabilitato per stabilità)
# --------------------------
WIFI_PWR_ON_PRF=off
WIFI_PWR_ON_BAL=off
WIFI_PWR_ON_SAV=off

# --------------------------
# PCIe Active State Power Management
# Nota: inefficace finché pcie_aspm=off è presente nella cmdline del kernel
# --------------------------
PCIE_ASPM_ON_PRF=powersave
PCIE_ASPM_ON_BAL=powersupersave
PCIE_ASPM_ON_SAV=powersupersave

# --------------------------
# Runtime Power Management
# --------------------------
RUNTIME_PM_ON_PRF=on
RUNTIME_PM_ON_BAL=auto
RUNTIME_PM_ON_SAV=auto
RUNTIME_PM_DENYLIST="02:00.0"   # Broadcom BCM4350

# --------------------------
# USB Autosuspend
# --------------------------
USB_AUTOSUSPEND=1
USB_DENYLIST=""

# --------------------------
# Audio Power Saving (0 evita pop/click su HDA)
# --------------------------
SOUND_POWER_SAVE_ON_PRF=0
SOUND_POWER_SAVE_ON_BAL=0
SOUND_POWER_SAVE_ON_SAV=0

# --------------------------
# NMI Watchdog
# --------------------------
NMI_WATCHDOG=0
